<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment | Lawbenpina Ventures</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#ef0e52">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="index.html" aria-label="Lawbenpina Ventures home"><img src="logo.png" alt="Lawbenpina Ventures"></a>
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="mainNav">Menu</button>
    <nav id="mainNav">
      <a href="index.html">Home</a>
      <a class="active" href="shop.html">Shop</a>
      <a href="guides.html">Guides</a>
      <a href="how-it-works.html">How it works</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a class="btn btn-primary btn-sm" href="order.html">Place an order</a>
    </nav>
  </div>
</header>

<div class="page-hero">
  <div class="wrap">
    <span class="eyebrow">Payment</span>
    <h1 id="ttl">Checking your payment&hellip;</h1>
    <p id="sub">Please wait a moment while we confirm your payment with Paystack.</p>
  </div>
</div>

<section class="tight" id="main">
  <div class="wrap">
    <div class="card" id="resultCard" hidden>
      <div class="done-box">
        <span class="eyebrow" id="resEyebrow"></span>
        <h2 style="margin-top:8px;" id="resTitle"></h2>
        <div class="ref" id="resRef"></div>
        <p id="resMsg"></p>
      </div>
      <div class="review" id="resSummary"></div>
      <div class="row no-print" id="resActions" style="margin-top:20px;justify-content:center;"></div>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-brand"><img src="logo.png" alt="Lawbenpina Ventures"><span>&copy; <span class="js-year"></span> Lawbenpina Ventures, Accra, Ghana</span></div>
    <div class="foot-links"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="guides.html">Guides</a><a href="how-it-works.html">How it works</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="terms.html">Terms</a><a href="privacy.html">Privacy</a></div>
  </div>
</footer>

<!-- Registers the form with Netlify so you also get an email when a payment is confirmed. Filled by payment-success.js. -->
<form name="payment-confirmation" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field">
  <input name="order_ref"><input name="paystack_reference"><input name="amount_ghs"><input name="channel"><input name="customer"><input name="paid_at">
</form>

<script src="site.js"></script>
<script src="payment-success.js"></script>
</body>
</html>
